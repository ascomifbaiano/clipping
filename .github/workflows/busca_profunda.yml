name: Busca Profunda de Menções Perdidas (Manual)

# Disparo exclusivamente manual. Use quando o motor diário ficou inativo por
# vários dias e é necessário recuperar menções da janela perdida.
on:
  workflow_dispatch:
    inputs:
      dias_atras:
        description: 'Quantos dias para trás a busca deve cobrir (padrão: 45)'
        required: false
        default: '45'
        type: string

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  busca-profunda:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Código (Histórico Completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Motor de Busca Profunda
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          DIAS_ATRAS: ${{ github.event.inputs.dias_atras }}
        run: python scraper_busca_profunda.py

      - name: Executar Saneamento de Falsos Positivos
        run: python limpar_clipping_falsos_positivos.py

      - name: Sincronizar e Enviar Dados para o GitHub
        run: |
          git config --global user.name "Robo Clipping IF Baiano"
          git config --global user.email "automacao@dicom.ifbaiano.edu.br"
          git pull --rebase origin main || true
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Busca profunda: menções recuperadas (janela ${{ github.event.inputs.dias_atras }} dias) [skip ci]"
            git push origin main
          else
            echo "Nenhuma nova menção encontrada na janela de busca."
          fi
