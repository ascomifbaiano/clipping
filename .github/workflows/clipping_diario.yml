name: Atualização Periódica do Clipping de Mídia

on:
  schedule:
    # Roda a cada 12 horas (ex: 03:00 e 15:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch:
    # Permite rodar o robô manualmente pelo painel do GitHub a qualquer momento

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Configurar código-fonte
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configurar ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar Motor de Clipping
      run: |
        python scraper_clipping.py

    - name: Commit e Push dos dados atualizados
      run: |
        git config --global user.name "GitHub Actions Scraper"
        git config --global user.email "actions@github.com"
        # Adiciona a pasta data/ (incluindo CSVs, stats.json e a blacklist de descartados)
        git add data/
        # Só realiza o commit se houver modificações nos arquivos de dados
        if ! git diff --cached --quiet; then
          git commit -m "Atualização automática: novos recortes de mídia coletados [skip ci]"
          git push
        else
          echo "Sem novidades ou alterações para commitar."
        fi
