name: Automação do App 2 (Clipping)

on:
  schedule:
    - cron: '*/30 * * * *' 
  workflow_dispatch: 

jobs:
  atualizar-clipping:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Baixar o repositório
        uses: actions/checkout@v4

      - name: 2. Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalar dependências
        run: pip install -r requirements.txt

      - name: 4. Executar Motor de Clipping
        run: python scraper_clipping.py

      - name: 5. Salvar dados na nuvem
        run: |
          git config --global user.name "Robo DICOM"
          git config --global user.email "automacao@dicom.ifbaiano"
          git add data/ || echo "Pasta data não encontrada."
          git diff-index --quiet HEAD || git commit -m "📰 Atualização do Acervo de Mídia Externa"
          git push
          
