name: Varredura Histórica 2012-Hoje (Manual)

# Disparo exclusivamente manual. Executa uma varredura completa desde 2012
# até a data atual, usando o scraper_carga_inicial.py com escopo ampliado.
# ATENÇÃO: Esta execução pode levar até 5 horas pelo volume de dados.
# Execute apenas quando necessário para recompor a base histórica completa.
on:
  workflow_dispatch:
    inputs:
      confirmar_execucao:
        description: 'Digite "CONFIRMAR" para iniciar a varredura histórica completa'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  ANO_INICIO_HISTORICO: "2012"

jobs:
  varredura-historica:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    # Proteção: só executa se o usuário digitou "CONFIRMAR"
    if: ${{ github.event.inputs.confirmar_execucao == 'CONFIRMAR' }}

    steps:
      - name: Checkout Código (Histórico Completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Varredura Histórica Completa (2012 - Hoje)
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python scraper_carga_inicial.py

      - name: Executar Saneamento de Falsos Positivos
        run: python limpar_clipping_falsos_positivos.py

      - name: Sincronizar e Enviar Dados para o GitHub
        run: |
          git config --global user.name "Robo Clipping IF Baiano"
          git config --global user.email "automacao@dicom.ifbaiano.edu.br"
          git pull --rebase origin main || true
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Varredura histórica 2012-hoje: base histórica recomposta [skip ci]"
            git push origin main
          else
            echo "Nenhum novo registro histórico encontrado."
          fi
